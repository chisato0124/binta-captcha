<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">

<title>高難易度ビンタクイズ</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(
    180deg,
    #fff8ef 0%,
    #eef5ff 100%
  );
  color:#263246;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.wrap{
  min-height:100svh;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  padding:18px 12px 34px;
}

.card{
  width:min(100%,440px);

  background:#fff;

  border:2px solid #263246;
  border-radius:24px;

  padding:18px;

  box-shadow:0 8px 0 #263246;
}


/* ==========================================
   共通ボタン
========================================== */

button{
  font-family:inherit;
  touch-action:manipulation;
}


/* ==========================================
   タイトル画面
========================================== */

#titleScreen{
  text-align:center;
  padding:8px 4px 10px;
}

.title-badge{
  display:inline-block;

  background:#263246;
  color:#fff;

  border-radius:999px;

  padding:6px 12px;

  font-size:11px;
  font-weight:800;

  letter-spacing:.04em;

  margin-bottom:12px;
}

.titleScreenTitle{
  margin:0;

  font-size:32px;
  line-height:1.2;

  font-weight:900;

  letter-spacing:-.03em;
}

.title-sub{
  margin:8px 0 4px;

  font-size:13px;

  color:#7a8495;

  font-weight:700;
}


/* ==========================================
   タイトルのキャバリア
========================================== */

.title-dog{
  width:min(100%,290px);

  height:auto;

  display:block;

  margin:8px auto 4px;
}


/* ==========================================
   スタートボタン
========================================== */

.start-button{

  width:100%;

  border:2px solid #263246;

  border-radius:15px;

  background:#ffcf70;

  color:#263246;

  padding:15px 16px;

  font-size:18px;

  font-weight:900;

  cursor:pointer;

  box-shadow:0 4px 0 #263246;

  transition:
    transform .08s ease,
    box-shadow .08s ease;
}

.start-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #263246;
}


/* ==========================================
   ゲーム画面
========================================== */

#game{
  display:none;
}

.brand{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:8px;
}

.paw{
  width:42px;
  height:42px;

  border-radius:14px;

  background:#ffcf70;

  display:grid;
  place-items:center;

  font-size:23px;

  border:2px solid #263246;
}

h1{
  font-size:23px;

  margin:0;

  font-weight:900;
}

.sub{
  font-size:11px;

  color:#697386;

  margin-top:2px;

  font-weight:700;
}

.question{
  font-size:20px;

  font-weight:900;

  margin:14px 0 8px;

  line-height:1.4;
}

.note{
  font-size:12px;

  color:#697386;

  margin:0 0 13px;

  line-height:1.5;
}


/* ==========================================
   画像グリッド
========================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}

.tile{
  position:relative;

  aspect-ratio:1/1;

  padding:0;

  border:3px solid transparent;

  border-radius:12px;

  overflow:hidden;

  background:#eee;

  cursor:pointer;

  touch-action:manipulation;

  transition:
    transform .08s ease,
    border-color .08s ease;
}

.tile:active{
  transform:scale(.97);
}

.tile img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.tile.selected{
  border-color:#ff5b61;

  transform:translateY(-1px);
}

.tile.selected::after{
  content:"";

  position:absolute;

  inset:0;

  background:rgba(255,91,97,.14);

  pointer-events:none;
}


/* ==========================================
   チェックマーク
========================================== */

.check{
  position:absolute;

  right:5px;
  bottom:5px;

  width:27px;
  height:27px;

  border-radius:50%;

  background:#ff5b61;

  color:white;

  display:none;

  align-items:center;
  justify-content:center;

  font-weight:900;

  z-index:2;

  border:2px solid white;
}

.tile.selected .check{
  display:flex;
}


/* ==========================================
   決定ボタン
========================================== */

.actions{
  margin-top:15px;
}

button.confirm{

  width:100%;

  border:2px solid #263246;

  border-radius:14px;

  background:#ffcf70;

  color:#263246;

  padding:14px 16px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  box-shadow:0 4px 0 #263246;

  transition:
    transform .08s ease,
    box-shadow .08s ease;
}

button.confirm:active:not(:disabled){
  transform:translateY(3px);

  box-shadow:0 1px 0 #263246;
}

button.confirm:disabled{

  background:#e8e9ed;

  color:#9aa0ad;

  box-shadow:none;

  border-color:#cfd3da;

  cursor:not-allowed;
}


/* ==========================================
   結果画面
========================================== */

.result{
  display:none;

  text-align:center;

  padding:5px 3px 8px;
}

.result.show{
  display:block;
}

.result.success{

  background:
    linear-gradient(
      180deg,
      #fffdf1,
      #eaffea
    );

  border-radius:20px;

  padding:14px 9px 18px;
}

.result.failure{

  background:
    linear-gradient(
      180deg,
      #f4f1ff,
      #fff1f3
    );

  border-radius:20px;

  padding:14px 9px 18px;
}


/* ==========================================
   結果イラスト
========================================== */

.dog-illust{

  width:min(100%,270px);

  height:auto;

  display:block;

  margin:0 auto 3px;
}


/* ==========================================
   結果バッジ
========================================== */

.badge{

  display:inline-block;

  background:#263246;

  color:#fff;

  border-radius:999px;

  padding:5px 10px;

  font-size:10px;

  font-weight:800;

  margin-bottom:7px;

  letter-spacing:.04em;
}

.result h2{

  margin:3px 0 8px;

  font-size:28px;

  line-height:1.2;

  font-weight:900;
}

.result.success h2{
  color:#1f9b61;
}

.result.failure h2{
  color:#7655b6;
}

.result p{

  margin:0 0 16px;

  color:#596273;

  line-height:1.6;

  font-weight:700;
}


/* ==========================================
   もう一回ボタン
========================================== */

.retry{

  width:100%;

  border:2px solid #263246;

  border-radius:15px;

  padding:14px 16px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  box-shadow:0 4px 0 #263246;

  transition:
    transform .08s ease,
    box-shadow .08s ease;
}

.retry:active{

  transform:translateY(3px);

  box-shadow:0 1px 0 #263246;
}

.result.success .retry{
  background:#9de2a9;
}

.result.failure .retry{
  background:#c9b9f2;
}


/* ==========================================
   フッター
========================================== */

.footer{

  font-size:10px;

  color:#8991a0;

  text-align:center;

  margin-top:12px;

  line-height:1.5;
}


@media(max-width:360px){

  .card{
    padding:14px;
  }

  .grid{
    gap:4px;
  }

  .titleScreenTitle{
    font-size:28px;
  }

  .question{
    font-size:18px;
  }

}

</style>
</head>

<script>


/* ==========================================
   当たり画像 30枚
========================================== */

const hits = Array.from(
  {length:30},
  (_,i) =>
    `hit${String(i+1).padStart(2,"0")}.jpeg`
);


/* ==========================================
   ハズレ画像 10枚
========================================== */

const misses = Array.from(
  {length:10},
  (_,i) =>
    `miss${String(i+1).padStart(2,"0")}.jpeg`
);


/* ==========================================
   シャッフル
========================================== */

function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];
  }

  return a;
}


/* ==========================================
   1ゲーム分の9枚を作成
========================================== */

function makeRound(){

  /*
    ハズレは1～5枚。

    必ず最低1枚は入る。
  */

  const missCount=
    Math.floor(
      Math.random()*5
    )+1;


  /*
    残りは当たり
  */

  const hitCount=
    9-missCount;


  /*
    当たり画像を抽選
  */

  const selectedHits=
    shuffle(hits)
      .slice(0,hitCount);


  /*
    ハズレ画像を抽選
  */

  const selectedMisses=
    shuffle(misses)
      .slice(0,missCount);


  /*
    正解情報を付ける
  */

  const roundItems=[

    ...selectedHits.map(
      src=>({
        src,
        correct:true
      })
    ),

    ...selectedMisses.map(
      src=>({
        src,
        correct:false
      })
    )

  ];


  /*
    最後に全体をシャッフル
  */

  return shuffle(roundItems);
}


/* ==========================================
   HTML要素
========================================== */

const titleScreen=
  document.getElementById(
    "titleScreen"
  );

const startButton=
  document.getElementById(
    "startButton"
  );

const grid=
  document.getElementById(
    "grid"
  );

const confirmBtn=
  document.getElementById(
    "confirm"
  );

    "game"
  );

  );

  );

  );

  );

const retry=

  );


/* ==========================================
   成功時キャバリア
========================================== */

const happyDog=`

/* ==========================================

const sadDog=`

/* ==========================================
   ゲーム開始
========================================== */

function startGame(){

  /*
    タイトルを隠す
  */

  titleScreen.style.display=
    "none";


  /*
    ゲームを表示
  */

  game.style.display=
    "block";


  /*
    結果画面を隠す
  */

  result.className=
    "result";


  /*
    画像をクリア
  */

  grid.innerHTML=
    "";


  /*
    決定ボタンを無効化
  */

  confirmBtn.disabled=
    true;


  /*
    今回の9枚を作る
  */

  const round=
    makeRound();


  /*
    9枚を表示
  */

  round.forEach(
    (item,i)=>{

      const tile=
        document.createElement(
          "button"
        );

      tile.className=
        "tile";

      tile.type=
        "button";


      tile.innerHTML=`

        <img
          src="${item.src}"
          alt="犬の画像 ${i+1}"
          loading="eager"
        >

        <span class="check">
          ✓
        </span>

      `;


      /*
        正解情報
      */

      tile.dataset.correct=
        item.correct
          ? "1"
          : "0";


      /*
        タップで選択・解除
      */

      tile.addEventListener(
        "click",
        ()=>{

          tile.classList.toggle(
            "selected"
          );


          /*
            1枚以上選択されたら
            決定ボタンを有効化
          */

          confirmBtn.disabled=
            !document.querySelector(
              ".tile.selected"
            );

        }
      );


      grid.appendChild(
        tile
      );

    }
  );

}


/* ==========================================
   スタートボタン
========================================== */

startButton.addEventListener(
  "click",
  startGame
);


/* ==========================================
   決定ボタン
========================================== */

confirmBtn.addEventListener(
  "click",
  ()=>{

    const tiles=
      [
        ...document.querySelectorAll(
          ".tile"
        )
      ];


    /*
      判定

      当たり → 選択
      ハズレ → 未選択

      9枚すべて正しければ成功
    */

    const ok=
      tiles.every(
        t=>{

          const selected=
            t.classList.contains(
              "selected"
            );

          const correct=
            t.dataset.correct===
            "1";

          return selected===
            correct;

        }
      );


    /*
      ゲーム画面を隠す
    */

    game.style.display=
      "none";


    /*
      結果画面を表示
    */

    result.className=
      "result show "+
      (ok
        ? "success"
        : "failure"
      );


    /* ======================================
       成功
    ====================================== */

    if(ok){

      mark.innerHTML=
        happyDog;

      badge.textContent=
        "AUTHENTICATION SUCCESS";

      resultTitle.textContent=
        "認証成功！";

      resultText.textContent=
        "すべてのビンタを見つけたよ！";

    }


    /* ======================================
       失敗
    ====================================== */

    else{

      mark.innerHTML=
        sadDog;

      badge.textContent=
        "AUTHENTICATION FAILED";

      resultTitle.textContent=
        "残念……！";

      resultText.textContent=
        "ニセビンタがいるよ！";

    }

  }
);


/* ==========================================
   もう一回チャレンジ
========================================== */

retry.addEventListener(
  "click",
  startGame
);

</script>
