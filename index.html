<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#F7F3EE"
>

<title>高難易度ビンタクイズ</title>


<style>

/* ==================================================
   基本設定
================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#F7F3EE;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  color:#3B302B;

  -webkit-tap-highlight-color:transparent;
}


/* ==================================================
   全体
================================================== */

#app{
  width:100%;
  min-height:100svh;
}

.screen{
  width:100%;
  min-height:100svh;
}


/* ==================================================
   タイトル画面
================================================== */

#titleScreen{
  display:block;

  width:100%;
  min-height:100svh;

  cursor:pointer;

  touch-action:manipulation;
}

#titleScreen img{
  display:block;

  width:100%;
  height:100svh;

  object-fit:contain;
}


/* ==================================================
   ゲーム画面
================================================== */

#gameScreen{
  display:none;

  min-height:100svh;

  padding:
    max(18px, env(safe-area-inset-top))
    14px
    max(28px, env(safe-area-inset-bottom));

  background:#F7F3EE;
}

.game-card{
  width:min(100%,440px);

  margin:0 auto;

  background:#FFFFFF;

  border:1px solid #E3DCD5;

  border-radius:28px;

  padding:20px;

  box-shadow:
    0 8px 24px rgba(75,55,45,.08);
}


/* ==================================================
   ゲームタイトル
================================================== */

.brand{
  display:flex;

  align-items:center;

  gap:11px;

  margin-bottom:20px;
}

.brand-mark{
  width:44px;
  height:44px;

  border-radius:14px;

  background:#F2D2B7;

  display:grid;
  place-items:center;

  flex-shrink:0;
}

.brand-mark svg{
  width:29px;
  height:29px;
}

.brand-title{
  margin:0;

  font-size:21px;

  font-weight:900;

  line-height:1.1;
}

.brand-sub{
  margin-top:4px;

  color:#93867E;

  font-size:10px;

  font-weight:700;

  letter-spacing:1px;
}


/* ==================================================
   問題文
================================================== */

.question{
  margin:0 0 8px;

  font-size:24px;

  line-height:1.3;

  font-weight:900;

  letter-spacing:-.4px;
}

.note{
  margin:0 0 18px;

  color:#8A7D75;

  font-size:12px;

  line-height:1.6;
}


/* ==================================================
   画像グリッド
================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.tile{
  position:relative;

  aspect-ratio:1/1;

  padding:0;

  border:3px solid transparent;

  border-radius:15px;

  overflow:hidden;

  background:#F1EFEC;

  cursor:pointer;

  touch-action:manipulation;

  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.tile img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.tile.selected{
  border-color:#D98A62;

  transform:translateY(-2px);

  box-shadow:
    0 4px 12px rgba(217,138,98,.22);
}

.tile.selected::after{
  content:"";

  position:absolute;

  inset:0;

  background:rgba(217,138,98,.10);

  pointer-events:none;
}

.check{
  position:absolute;

  right:6px;
  bottom:6px;

  width:27px;
  height:27px;

  border-radius:50%;

  background:#D98A62;

  color:#FFFFFF;

  display:none;

  align-items:center;
  justify-content:center;

  font-size:15px;

  font-weight:900;

  z-index:2;

  box-shadow:
    0 2px 5px rgba(0,0,0,.15);
}

.tile.selected .check{
  display:flex;
}


/* ==================================================
   決定ボタン
================================================== */

.actions{
  margin-top:17px;
}

.confirm{
  width:100%;

  border:0;

  border-radius:15px;

  background:#3B302B;

  color:#FFFFFF;

  padding:15px 16px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;

  box-shadow:
    0 3px 0 #241D19;
}

.confirm:active:not(:disabled){
  transform:translateY(2px);

  box-shadow:
    0 1px 0 #241D19;
}

.confirm:disabled{
  background:#E7E2DE;

  color:#AAA09A;

  box-shadow:none;

  cursor:not-allowed;
}


/* ==================================================
   結果画面
================================================== */

#resultScreen{
  display:none;

  width:100%;
  min-height:100svh;

  cursor:pointer;

  touch-action:manipulation;
}

#resultScreen img{
  display:block;

  width:100%;
  height:100svh;

  object-fit:contain;
}


/* ==================================================
   小さいスマホ
================================================== */

@media(max-width:360px){

  #gameScreen{
    padding:
      max(12px, env(safe-area-inset-top))
      10px
      max(20px, env(safe-area-inset-bottom));
  }

  .game-card{
    padding:16px;

    border-radius:24px;
  }

  .question{
    font-size:21px;
  }

  .grid{
    gap:6px;
  }

  .tile{
    border-radius:12px;
  }

}

</style>

</head>


<body>


<div id="app">


  <!-- ==================================================
       タイトル画面

       image01.jpeg
       画面のどこをタップしてもゲーム開始
  ================================================== -->

  <section
    id="titleScreen"
    aria-label="高難易度ビンタクイズ スタート"
  >

    <img
      src="image01.jpeg"
      alt="高難易度ビンタクイズ 本物のビンタを見抜け！"
    >

  </section>



  <!-- ==================================================
       ゲーム画面
  ================================================== -->

  <section
    id="gameScreen"
  >

    <main class="game-card">


      <div class="brand">

        <div class="brand-mark">

          <svg
            viewBox="0 0 40 40"
            aria-hidden="true"
          >

            <ellipse
              cx="20"
              cy="25"
              rx="8"
              ry="10"
              fill="#6B4638"
            />

            <circle
              cx="11"
              cy="13"
              r="4"
              fill="#6B4638"
            />

            <circle
              cx="18"
              cy="9"
              r="4"
              fill="#6B4638"
            />

            <circle
              cx="25"
              cy="9"
              r="4"
              fill="#6B4638"
            />

            <circle
              cx="31"
              cy="14"
              r="4"
              fill="#6B4638"
            />

          </svg>

        </div>


        <div>

          <h2 class="brand-title">
            ビンタ認証
          </h2>

          <div class="brand-sub">
            BINTA CAPTCHA
          </div>

        </div>

      </div>



      <p class="question">
        ビンタだけを選んでね
      </p>

      <p class="note">
        9枚の中には、ビンタ画像が4～8枚あります。
      </p>


      <div
        id="grid"
        class="grid"
      ></div>


      <div class="actions">

        <button
          id="confirm"
          class="confirm"
          type="button"
          disabled
        >
          これで決定
        </button>

      </div>


    </main>

  </section>



  <!-- ==================================================
       結果画面

       image02.png → 不正解
       image03.png → 正解

       画像のどこをタップしても
       次の問題へ
  ================================================== -->

  <section
    id="resultScreen"
    aria-label="クイズ結果"
  >

    <img
      id="resultImage"
      src=""
      alt="クイズ結果"
    >

  </section>


</div>



<script>

/* ==================================================
   ビンタ画像

   当たり
   hit01.jpeg ～ hit30.jpeg

   ハズレ
   miss01.jpeg ～ miss10.jpeg
================================================== */

const hits = Array.from(
  {length:30},
  (_,i) =>
    `hit${String(i + 1).padStart(2,"0")}.jpeg`
);

const misses = Array.from(
  {length:10},
  (_,i) =>
    `miss${String(i + 1).padStart(2,"0")}.jpeg`
);


/* ==================================================
   画面要素
================================================== */

const titleScreen =
  document.getElementById("titleScreen");

const gameScreen =
  document.getElementById("gameScreen");

const resultScreen =
  document.getElementById("resultScreen");

const resultImage =
  document.getElementById("resultImage");

const grid =
  document.getElementById("grid");

const confirmBtn =
  document.getElementById("confirm");


/* ==================================================
   シャッフル
================================================== */

function shuffle(arr){

  const a = [...arr];

  for(
    let i = a.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;
}


/* ==================================================
   1ゲーム分の9枚を作成
================================================== */

function makeRound(){

  /*
    ハズレは1～5枚
  */

  const missCount =
    Math.floor(Math.random() * 5) + 1;


  /*
    残りは当たり
  */

  const hitCount =
    9 - missCount;


  /*
    当たり画像
  */

  const selectedHits =
    shuffle(hits)
      .slice(0,hitCount);


  /*
    ハズレ画像
  */

  const selectedMisses =
    shuffle(misses)
      .slice(0,missCount);


  /*
    正解情報を付ける
  */

  const roundItems = [

    ...selectedHits.map(
      src => ({
        src:src,
        correct:true
      })
    ),

    ...selectedMisses.map(
      src => ({
        src:src,
        correct:false
      })
    )

  ];


  /*
    全体をシャッフル
  */

  return shuffle(roundItems);
}


/* ==================================================
   タイトル → ゲーム
================================================== */

titleScreen.addEventListener(
  "click",
  startGame
);


/* ==================================================
   ゲーム開始
================================================== */

function startGame(){

  titleScreen.style.display =
    "none";

  resultScreen.style.display =
    "none";

  gameScreen.style.display =
    "block";

  grid.innerHTML =
    "";

  confirmBtn.disabled =
    true;


  /*
    今回の問題
  */

  const round =
    makeRound();


  /*
    9枚表示
  */

  round.forEach(
    (item,i)=>{

      const tile =
        document.createElement("button");

      tile.className =
        "tile";

      tile.type =
        "button";


      tile.innerHTML = `

        <img
          src="${item.src}"
          alt="キャバリアの画像 ${i + 1}"
          loading="eager"
        >

        <span class="check">
          ✓
        </span>

      `;


      /*
        正解かどうか
      */

      tile.dataset.correct =
        item.correct ? "1" : "0";


      /*
        選択 / 解除
      */

      tile.addEventListener(
        "click",
        ()=>{

          tile.classList.toggle(
            "selected"
          );


          /*
            1枚以上選択されていれば
            決定可能
          */

          confirmBtn.disabled =
            !document.querySelector(
              ".tile.selected"
            );

        }
      );


      grid.appendChild(tile);

    }
  );

}


/* ==================================================
   決定
================================================== */

confirmBtn.addEventListener(
  "click",
  checkAnswer
);


/* ==================================================
   正解判定
================================================== */

function checkAnswer(){

  const tiles = [
    ...document.querySelectorAll(
      ".tile"
    )
  ];


  /*
    当たり
    → 選択

    ハズレ
    → 未選択

    なら正解
  */

  const ok =
    tiles.every(
      tile=>{

        const selected =
          tile.classList.contains(
            "selected"
          );

        const correct =
          tile.dataset.correct === "1";

        return selected === correct;

      }
    );


  /*
    ゲーム画面を隠す
  */

  gameScreen.style.display =
    "none";


  /*
    結果画像を設定
  */

  if(ok){

    /*
      正解画像
      image03.png
    */

    resultImage.src =
      "image03.png";

    resultImage.alt =
      "大正解！ よく見つけました！";

  }
  else{

    /*
      不正解画像
      image02.png
    */

    resultImage.src =
      "image02.png";

    resultImage.alt =
      "残念…… ニセビンタがいるよ！";

  }


  /*
    結果画面表示
  */

  resultScreen.style.display =
    "block";


  /*
    ページ上部へ
  */

  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* ==================================================
   結果画面

   どこをタップしても
   → 新しい問題
================================================== */

resultScreen.addEventListener(
  "click",
  startGame
);

</script>


</body>
</html>
