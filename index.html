<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>ビンタ認証</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#fff8ef 0%,#eef5ff 100%);
  color:#263246;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif
}

.wrap{
  min-height:100svh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:18px 12px 34px
}

.card{
  width:min(100%,440px);
  background:#fff;
  border:2px solid #263246;
  border-radius:24px;
  padding:18px;
  box-shadow:0 8px 0 #263246
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px
}

.paw{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#ffcf70;
  display:grid;
  place-items:center;
  font-size:24px;
  border:2px solid #263246
}

h1{
  font-size:23px;
  margin:0;
  font-weight:800
}

.sub{
  font-size:12px;
  color:#697386;
  margin-top:2px
}

.question{
  font-size:18px;
  font-weight:800;
  margin:12px 0
}

.note{
  font-size:12px;
  color:#697386;
  margin:-4px 0 12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px
}

.tile{
  position:relative;
  aspect-ratio:1/1;
  padding:0;
  border:3px solid transparent;
  border-radius:11px;
  overflow:hidden;
  background:#eee;
  cursor:pointer;
  touch-action:manipulation
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.tile.selected{
  border-color:#ff5b61;
  transform:translateY(-1px)
}

.tile.selected::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,91,97,.14);
  pointer-events:none
}

.check{
  position:absolute;
  right:5px;
  bottom:5px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#ff5b61;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:900;
  z-index:2;
  border:2px solid white
}

.tile.selected .check{
  display:flex
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px
}

button.confirm{
  width:100%;
  border:2px solid #263246;
  border-radius:14px;
  background:#ffcf70;
  color:#263246;
  padding:13px 16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 #263246
}

button.confirm:disabled{
  background:#e8e9ed;
  color:#9aa0ad;
  box-shadow:none;
  border-color:#cfd3da;
  cursor:not-allowed
}

.result{
  display:none;
  text-align:center;
  padding:6px 3px 8px
}

.result.show{
  display:block
}

.result.success{
  background:linear-gradient(180deg,#fffdf1,#eaffea);
  border-radius:20px;
  padding:12px 8px 18px
}

.result.failure{
  background:linear-gradient(180deg,#f4f1ff,#fff1f3);
  border-radius:20px;
  padding:12px 8px 18px
}

.result h2{
  margin:3px 0 8px;
  font-size:28px
}

.result.success h2{
  color:#1f9b61
}

.result.failure h2{
  color:#7655b6
}

.result p{
  margin:0 0 16px;
  color:#596273;
  line-height:1.6;
  font-weight:600
}

.dog-illust{
  width:min(100%,270px);
  height:auto
}

.retry{
  width:100%;
  border:2px solid #263246;
  border-radius:15px;
  padding:13px 16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 #263246
}

.result.success .retry{
  background:#9de2a9
}

.result.failure .retry{
  background:#c9b9f2
}

.badge{
  display:inline-block;
  background:#263246;
  color:#fff;
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  font-weight:800;
  margin-bottom:7px
}

.footer{
  font-size:10px;
  color:#8991a0;
  text-align:center;
  margin-top:12px;
  line-height:1.5
}

@media (max-width:360px){
  .card{padding:14px}
  .grid{gap:4px}
  h1{font-size:20px}
}
</style>
</head>

<body>

<div class="wrap">
<main class="card">

<section id="game">

  <div class="brand">
    <div class="paw">🐾</div>
    <div>
      <h1>ビンタ認証</h1>
      <div class="sub">BINTA CAPTCHA</div>
    </div>
  </div>

  <p class="question">
    「ビンタされているキャバリア」をすべて選んでください
  </p>

  <p class="note">
    9枚の中には、ビンタ画像が4～8枚あります。
  </p>

  <div id="grid" class="grid"></div>

  <div class="actions">
    <button id="confirm" class="confirm" disabled>
      これで決定！
    </button>
  </div>

</section>


<section id="result" class="result">

  <div id="mark"></div>

  <div class="badge" id="badge"></div>

  <h2 id="resultTitle"></h2>

  <p id="resultText"></p>

  <button id="retry" class="retry">
    🐾 もう一回チャレンジ
  </button>

</section>


<div class="footer">
  画像はこのHTMLと同じGitHubリポジトリに置いてください。
</div>

</main>
</div>


<script>

/*
  ============================================
  ビンタ認証

  当たり画像：
  hit01.jpeg ～ hit30.jpeg

  ハズレ画像：
  miss01.jpeg ～ miss10.jpeg

  毎回9枚を表示。

  ハズレは1～5枚をランダムに選択。
  残りを当たり画像で埋める。

  つまり、

  ハズレ1枚 → 当たり8枚
  ハズレ2枚 → 当たり7枚
  ハズレ3枚 → 当たり6枚
  ハズレ4枚 → 当たり5枚
  ハズレ5枚 → 当たり4枚

  となる。

  同じラウンド内では画像を重複させない。
  ============================================
*/


/* ==========================================
   当たり画像 30枚
   ========================================== */

const hits = Array.from(
  {length:30},
  (_,i) => `hit${String(i+1).padStart(2,"0")}.jpeg`
);


/* ==========================================
   ハズレ画像 10枚
   ========================================== */

const misses = Array.from(
  {length:10},
  (_,i) => `miss${String(i+1).padStart(2,"0")}.jpeg`
);


/* ==========================================
   配列をランダムにシャッフル
   ========================================== */

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}


/* ==========================================
   1ゲーム分の9枚を作る
   ========================================== */

function makeRound(){

  /*
    ハズレ枚数を
    1～5枚からランダム決定
  */

  const missCount=
    Math.floor(Math.random()*5)+1;


  /*
    残りは当たり
  */

  const hitCount=
    9-missCount;


  /*
    当たり画像を
    重複なしで抽選
  */

  const selectedHits=
    shuffle(hits).slice(0,hitCount);


  /*
    ハズレ画像を
    重複なしで抽選
  */

  const selectedMisses=
    shuffle(misses).slice(0,missCount);


  /*
    当たり・ハズレをまとめる
  */

  const roundItems=[

    ...selectedHits.map(
      src=>({
        src,
        correct:true
      })
    ),

    ...selectedMisses.map(
      src=>({
        src,
        correct:false
      })
    )

  ];


  /*
    9枚全体をもう一度シャッフル
    → 当たり・ハズレの位置も毎回変わる
  */

  return shuffle(roundItems);
}


/* ==========================================
   HTML要素
   ========================================== */

const grid=
  document.getElementById("grid");

const confirmBtn=
  document.getElementById("confirm");

const game=
  document.getElementById("game");

const result=
  document.getElementById("result");

const mark=
  document.getElementById("mark");

const badge=
  document.getElementById("badge");

const resultTitle=
  document.getElementById("resultTitle");

const resultText=
  document.getElementById("resultText");

const retry=
  document.getElementById("retry");


/* ==========================================
   成功時のキャバリア
   ========================================== */

const happyDog=`

<svg
  viewBox="0 0 260 190"
  class="dog-illust"
  aria-label="キャバリアのイラスト"
  role="img"
>

<ellipse
  cx="130"
  cy="165"
  rx="83"
  ry="15"
  fill="#d9e6f2"
/>

<path
  d="M67 72 C37 39 28 83 49 111 C56 121 68 117 78 103Z"
  fill="#9b5b3f"
/>

<path
  d="M193 72 C223 39 232 83 211 111 C204 121 192 117 182 103Z"
  fill="#9b5b3f"
/>

<path
  d="M72 73 C83 39 177 39 188 73 L180 131 C170 156 90 156 80 131Z"
  fill="#fff4df"
  stroke="#6b4638"
  stroke-width="4"
/>

<path
  d="M86 65 C103 47 157 47 174 65 C158 72 102 72 86 65Z"
  fill="#9b5b3f"
/>

<ellipse
  cx="101"
  cy="94"
  rx="10"
  ry="13"
  fill="#35251f"
/>

<ellipse
  cx="159"
  cy="94"
  rx="10"
  ry="13"
  fill="#35251f"
/>

<circle
  cx="98"
  cy="90"
  r="3"
  fill="#fff"
/>

<circle
  cx="156"
  cy="90"
  r="3"
  fill="#fff"
/>

<path
  d="M117 111 Q130 101 143 111 Q140 124 130 124 Q120 124 117 111Z"
  fill="#35251f"
/>

<path
  d="M114 130 Q130 144 146 130"
  fill="none"
  stroke="#9b5b3f"
  stroke-width="5"
  stroke-linecap="round"
/>

</svg>

`;


/* ==========================================
   失敗時のキャバリア
   ========================================== */

const sadDog=`

<svg
  viewBox="0 0 260 190"
  class="dog-illust"
  aria-label="しょんぼりしたキャバリアのイラスト"
  role="img"
>

<ellipse
  cx="130"
  cy="165"
  rx="83"
  ry="15"
  fill="#dfe0ea"
/>

<path
  d="M67 72 C34 45 29 91 52 115 C61 124 72 116 79 101Z"
  fill="#8d5541"
/>

<path
  d="M193 72 C226 45 231 91 208 115 C199 124 188 116 181 101Z"
  fill="#8d5541"
/>

<path
  d="M72 73 C83 39 177 39 188 73 L180 132 C168 154 92 154 80 132Z"
  fill="#fff1dc"
  stroke="#63463d"
  stroke-width="4"
/>

<path
  d="M86 65 C102 48 158 48 174 65 C159 72 101 72 86 65Z"
  fill="#8d5541"
/>

<path
  d="M91 94 Q101 86 111 94"
  fill="none"
  stroke="#35251f"
  stroke-width="5"
  stroke-linecap="round"
/>

<path
  d="M149 94 Q159 86 169 94"
  fill="none"
  stroke="#35251f"
  stroke-width="5"
  stroke-linecap="round"
/>

<ellipse
  cx="130"
  cy="111"
  rx="13"
  ry="10"
  fill="#35251f"
/>

<path
  d="M115 137 Q130 124 145 137"
  fill="none"
  stroke="#9b5b3f"
  stroke-width="5"
  stroke-linecap="round"
/>

<path
  d="M37 42 L25 28 M218 42 L230 28"
  stroke="#9aa0ad"
  stroke-width="4"
  stroke-linecap="round"
/>

</svg>

`;


/* ==========================================
   ゲーム開始
   ========================================== */

function startGame(){

  /*
    ゲーム画面を表示
  */

  game.style.display="block";


  /*
    結果画面を非表示
  */

  result.className="result";


  /*
    画像をいったん全部消す
  */

  grid.innerHTML="";


  /*
    決定ボタンを無効化
  */

  confirmBtn.disabled=true;


  /*
    今回の9枚を作る
  */

  const round=
    makeRound();


  /*
    9枚を画面に表示
  */

  round.forEach((item,i)=>{

    const tile=
      document.createElement("button");

    tile.className="tile";

    tile.type="button";


    /*
      画像を表示
    */

    tile.innerHTML=`

      <img
        src="${item.src}"
        alt="犬の画像 ${i+1}"
        loading="eager"
      >

      <span class="check">✓</span>

    `;


    /*
      この画像が
      当たりかハズレかを記録
    */

    tile.dataset.correct=
      item.correct ? "1" : "0";


    /*
      タップで選択・解除
    */

    tile.addEventListener("click",()=>{

      tile.classList.toggle("selected");


      /*
        1枚以上選択されていれば
        決定ボタンを有効化
      */

      confirmBtn.disabled=
        !document.querySelector(".tile.selected");

    });


    grid.appendChild(tile);

  });

}


/* ==========================================
   決定ボタン
   ========================================== */

confirmBtn.addEventListener("click",()=>{

  const tiles=
    [...document.querySelectorAll(".tile")];


  /*
    判定

    当たり → 選択されている
    ハズレ → 選択されていない

    これが9枚すべて正しければ成功。
  */

  const ok=
    tiles.every(t=>{

      const selected=
        t.classList.contains("selected");

      const correct=
        t.dataset.correct==="1";

      return selected===correct;

    });


  /*
    ゲーム画面を隠す
  */

  game.style.display="none";


  /*
    成功・失敗画面を表示
  */

  result.className=
    "result show "+(ok?"success":"failure");


  /*
    成功
  */

  if(ok){

    mark.innerHTML=
      happyDog;

    badge.textContent=
      "AUTHENTICATION SUCCESS";

    resultTitle.textContent=
      "認証成功！";

    resultText.textContent=
      "よく見つけました！ビンタをすべて発見しました。";

  }


  /*
    失敗
  */

  else{

    mark.innerHTML=
      sadDog;

    badge.textContent=
      "AUTHENTICATION FAILED";

    resultTitle.textContent=
      "残念……！";

    resultText.textContent=
      "ビンタされているキャバリアをすべて見つけられませんでした。";

  }

});


/* ==========================================
   もう一回チャレンジ
   ========================================== */

retry.addEventListener(
  "click",
  startGame
);


/* ==========================================
   最初のゲームを開始
   ========================================== */

startGame();

</script>

</body>
</html>
