<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EE">
<title>高難易度ビンタクイズ</title>

<style>
*{
  box-sizing:border-box;
}

html{
  background:#F7F3EE;
}

body{
  margin:0;
  background:#F7F3EE;
  color:#3B302B;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* ================================
   全体
================================ */

.wrap{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px 12px 36px;
}

.card{
  width:min(100%,440px);
  background:#FFFFFF;
  border:1px solid #E3DCD5;
  border-radius:28px;
  padding:20px;
  box-shadow:0 8px 24px rgba(75,55,45,.08);
}

/* ================================
   タイトル画面
================================ */

#title{
  text-align:center;
}

.title-badge{
  display:inline-block;
  margin:4px auto 18px;
  padding:7px 15px;
  border-radius:999px;
  background:#3B302B;
  color:#FFFFFF;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.4px;
}

.title-main{
  margin:0;
  font-size:42px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-1px;
}

.title-main span{
  display:block;
}

.title-sub{
  margin:13px 0 0;
  color:#8A7D75;
  font-size:16px;
  font-weight:700;
}

.title-dog{
  width:min(100%,280px);
  margin:28px auto 24px;
  display:block;
}

.start-button{
  width:100%;
  border:0;
  border-radius:16px;
  background:#D98A62;
  color:#FFFFFF;
  padding:16px 18px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 #B96D4C;
  touch-action:manipulation;
}

.start-button:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #B96D4C;
}

/* ================================
   ゲーム画面
================================ */

#game{
  display:none;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:20px;
}

.brand-mark{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#F2D2B7;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.brand-mark svg{
  width:29px;
  height:29px;
}

.brand-title{
  margin:0;
  font-size:21px;
  font-weight:900;
  line-height:1.1;
}

.brand-sub{
  margin-top:4px;
  color:#93867E;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
}

.question{
  margin:0 0 8px;
  font-size:24px;
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.4px;
}

.note{
  margin:0 0 18px;
  color:#8A7D75;
  font-size:12px;
  line-height:1.6;
}

/* ================================
   写真グリッド
================================ */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.tile{
  position:relative;
  aspect-ratio:1/1;
  padding:0;
  border:3px solid transparent;
  border-radius:15px;
  overflow:hidden;
  background:#F1EFEC;
  cursor:pointer;
  touch-action:manipulation;
  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.tile.selected{
  border-color:#D98A62;
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(217,138,98,.22);
}

.tile.selected::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(217,138,98,.10);
  pointer-events:none;
}

.check{
  position:absolute;
  right:6px;
  bottom:6px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#D98A62;
  color:#FFFFFF;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  z-index:2;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.tile.selected .check{
  display:flex;
}

/* ================================
   決定ボタン
================================ */

.actions{
  margin-top:17px;
}

.confirm{
  width:100%;
  border:0;
  border-radius:15px;
  background:#3B302B;
  color:#FFFFFF;
  padding:15px 16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 3px 0 #241D19;
}

.confirm:active:not(:disabled){
  transform:translateY(2px);
  box-shadow:0 1px 0 #241D19;
}

.confirm:disabled{
  background:#E7E2DE;
  color:#AAA09A;
  box-shadow:none;
  cursor:not-allowed;
}

/* ================================
   結果画面
================================ */

.result{
  display:none;
  text-align:center;
}

.result.show{
  display:block;
}

.result-panel{
  border-radius:21px;
  padding:20px 15px 18px;
}

.result.success .result-panel{
  background:#EEF6EF;
}

.result.failure .result-panel{
  background:#FBF0EF;
}

.result-dog{
  width:min(100%,220px);
  margin:0 auto 8px;
  display:block;
}

.result-badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.result.success .result-badge{
  background:#71977A;
  color:#FFFFFF;
}

.result.failure .result-badge{
  background:#A96F6B;
  color:#FFFFFF;
}

.result h2{
  margin:12px 0 7px;
  font-size:29px;
  line-height:1.2;
  font-weight:900;
}

.result.success h2{
  color:#557D5D;
}

.result.failure h2{
  color:#9C625E;
}

.result p{
  margin:0 0 19px;
  color:#665A54;
  font-size:14px;
  line-height:1.7;
  font-weight:700;
}

.retry{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
}

.result.success .retry{
  background:#71977A;
  color:#FFFFFF;
  box-shadow:0 3px 0 #557D5D;
}

.result.failure .retry{
  background:#A96F6B;
  color:#FFFFFF;
  box-shadow:0 3px 0 #824F4B;
}

.retry:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}

/* ================================
   フッター
================================ */

.footer{
  margin-top:17px;
  text-align:center;
  color:#A49A94;
  font-size:10px;
  line-height:1.5;
}

/* ================================
   小さいスマホ
================================ */

@media(max-width:360px){

  .wrap{
    padding:14px 10px 28px;
  }

  .card{

    border-radius:24px;
  }

  .title-main{
    font-size:36px;
  }

  .question{
    font-size:21px;
  }

  .grid{
    gap:6px;
  }

  .tile{
    border-radius:12px;
  }
}
</style>
</head>


<body>

<main class="card">

<script>

/* =========================================
   ビンタ認証

   当たり画像
   hit01.jpeg ～ hit30.jpeg

   ハズレ画像
   miss01.jpeg ～ miss10.jpeg

   1ゲームにつき9枚。

   ハズレ1～5枚
   当たり4～8枚。

   同じゲーム内では画像重複なし。
========================================= */


/* =========================================
   画像リスト
========================================= */

const hits = Array.from(
  {length:30},
  (_,i) =>
    `hit${String(i+1).padStart(2,"0")}.jpeg`
);

const misses = Array.from(
  {length:10},
  (_,i) =>
    `miss${String(i+1).padStart(2,"0")}.jpeg`
);


/* =========================================
   シャッフル
========================================= */

function shuffle(arr){

  const a = [...arr];

  for(
    let i = a.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(Math.random() * (i + 1));

    [a[i],a[j]] =
      [a[j],a[i]];
  }

  return a;
}


/* =========================================
   1ゲーム分の9枚を作成
========================================= */

function makeRound(){

  /*
    ハズレは1～5枚
  */

  const missCount =
    Math.floor(Math.random() * 5) + 1;


  /*
    残りは当たり
  */

  const hitCount =
    9 - missCount;


  /*
    当たり画像を重複なしで抽選
  */

  const selectedHits =
    shuffle(hits).slice(0,hitCount);


  /*
    ハズレ画像を重複なしで抽選
  */

  const selectedMisses =
    shuffle(misses).slice(0,missCount);


  /*
    当たり・ハズレをまとめる
  */

  const roundItems = [

    ...selectedHits.map(
      src => ({
        src:src,
        correct:true
      })
    ),

    ...selectedMisses.map(
      src => ({
        src:src,
        correct:false
      })
    )

  ];


  /*
    最後に全体をシャッフル
  */

  return shuffle(roundItems);
}


/* =========================================
   HTML要素
========================================= */

const title =
  document.getElementById("title");

const start =
  document.getElementById("start");

const game =
  document.getElementById("game");

const grid =
  document.getElementById("grid");

const confirmBtn =
  document.getElementById("confirm");

const result =
  document.getElementById("result");

const mark =
  document.getElementById("mark");

const badge =
  document.getElementById("badge");

const resultTitle =
  document.getElementById("resultTitle");

const resultText =
  document.getElementById("resultText");

const retry =
  document.getElementById("retry");


/* =========================================
   成功キャバリア
========================================= */

const happyDog = `

<svg
  viewBox="0 0 300 220"
  class="result-dog"

>

<ellipse

/>

<!-- 左耳 -->
<path

     C53 61 37 91 48 125

     L108 102Z"
  fill="#9B5B40"
/>

<!-- 右耳 -->
<path

     C247 61 263 91 252 125
     C243 151 224 159 203 140
     L192 102Z"

/>

/>

<!-- 笑顔の目 -->

<!-- 鼻 -->

/>

/>

/>

<circle

</svg>

`;


/* =========================================
   失敗キャバリア
========================================= */

const sadDog = `

<svg
  viewBox="0 0 300 220"
  class="result-dog"
  aria-label="困った顔のキャバリア"
  role="img"
>

<ellipse
  cx="150"
  cy="199"
  rx="78"
  ry="11"
  fill="#E7DDDC"
/>

<!-- 左耳 -->
<path
  d="M87 82
     C53 61 37 91 48 125
     C57 151 76 159 97 140
     L108 102Z"
  fill="#9B5B40"
/>

<!-- 右耳 -->
<path
  d="M213 82
     C247 61 263 91 252 125
     C243 151 224 159 203 140
     L192 102Z"
  fill="#9B5B40"
/>

<!-- 顔 -->
<path
  d="M82 87
     C82 51 218 51 218 87
     L208 155
     C197 180 103 180 92 155Z"
  fill="#FFF4DF"
  stroke="#6B4638"
  stroke-width="5"
/>

<!-- 頭 -->
<path
  d="M94 87
     C108 60 192 60 206 87
     C184 98 116 98 94 87Z"
  fill="#9B5B40"
/>

<!-- 困った目 -->
<path
  d="M107 121 Q119 111 130 119"
  fill="none"
  stroke="#35251F"
  stroke-width="5"
  stroke-linecap="round"
/>

<path
  d="M170 119 Q181 111 193 121"
  fill="none"
  stroke="#35251F"
  stroke-width="5"
  stroke-linecap="round"
/>

<!-- 鼻 -->
<ellipse
  cx="150"
  cy="136"
  rx="15"
  ry="11"
  fill="#35251F"
/>

<!-- しょんぼり口 -->
<path
  d="M128 158 Q150 143 172 158"
  fill="none"
  stroke="#9B5B40"
  stroke-width="5"
  stroke-linecap="round"
/>

</svg>

`;


/* =========================================
   タイトル → ゲーム
========================================= */

start.addEventListener(
  "click",
  startGame
);


/* =========================================
   ゲーム開始
========================================= */

function startGame(){

  title.style.display =
    "none";

  game.style.display =
    "block";

  result.className =
    "result";

  grid.innerHTML =
    "";

  confirmBtn.disabled =
    true;


  /*
    今回の9枚
  */

  const round =
    makeRound();


  /*
    9枚を表示
  */

  round.forEach(
    (item,i)=>{

      const tile =
        document.createElement("button");

      tile.className =
        "tile";

      tile.type =
        "button";


      tile.innerHTML = `

        <img
          src="${item.src}"
          alt="キャバリアの画像 ${i+1}"
          loading="eager"
        >

        <span class="check">
          ✓
        </span>

      `;


      /*
        正解画像かどうか記録
      */

      tile.dataset.correct =
        item.correct ? "1" : "0";


      /*
        タップで選択・解除
      */

      tile.addEventListener(
        "click",
        ()=>{

          tile.classList.toggle(
            "selected"
          );


          /*
            1枚以上選択されている場合
            決定ボタンを有効化
          */

          confirmBtn.disabled =
            !document.querySelector(
              ".tile.selected"
            );

        }
      );


      grid.appendChild(tile);

    }
  );

}


/* =========================================
   決定
========================================= */

confirmBtn.addEventListener(
  "click",
  ()=>{

    const tiles =
      [
        ...document.querySelectorAll(
          ".tile"
        )
      ];


    /*
      全9枚について、

      当たり → 選択
      ハズレ → 未選択

      なら成功。
    */

    const ok =
      tiles.every(
        tile=>{

          const selected =
            tile.classList.contains(
              "selected"
            );

          const correct =
            tile.dataset.correct === "1";

          return selected === correct;

        }
      );


    /*
      ゲーム画面を隠す
    */

    game.style.display =
      "none";


    /*
      結果画面
    */

    result.className =
      "result show " +
      (ok ? "success" : "failure");


    /* ==========================
       成功
    ========================== */

    if(ok){

      mark.innerHTML =
        happyDog;

      badge.textContent =
        "AUTHENTICATION SUCCESS";

      resultTitle.textContent =
        "認証成功！";

      resultText.textContent =
        "ビンタをすべて見つけました。";

    }


    /* ==========================
       失敗
    ========================== */

    else{

      mark.innerHTML =
        sadDog;

      badge.textContent =
        "AUTHENTICATION FAILED";

      resultTitle.textContent =
        "残念……！";

      resultText.textContent =
        "ニセビンタがいるよ！";

    }

  }
);


/* =========================================
   もう一回チャレンジ
========================================= */

retry.addEventListener(
  "click",
  startGame
);

</script>
